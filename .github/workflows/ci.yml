name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Apollo Client v3 peer-caps graphql at ^16, so there is no v3/gql17 row.
        include:
          - apollo-client: "^3.8.0"
            graphql: "^16.8.0"
          - apollo-client: "^4.0.0"
            graphql: "^16.8.0"
          - apollo-client: "^4.0.0"
            graphql: "^17.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: pnpm install --frozen-lockfile
      - name: Pin @apollo/client to ${{ matrix.apollo-client }} and graphql to ${{ matrix.graphql }}
        # -w targets the workspace root explicitly. Without it, pnpm in a
        # workspace refuses `add` at root with ERR_PNPM_ADDING_TO_ROOT.
        run: pnpm add -w --save-dev "@apollo/client@$APOLLO_CLIENT_VERSION" "graphql@$GRAPHQL_VERSION"
        env:
          APOLLO_CLIENT_VERSION: ${{ matrix.apollo-client }}
          GRAPHQL_VERSION: ${{ matrix.graphql }}
      # Lib-only scope: the matrix row pins the root's apollo-client, which
      # would break the opposite-major test-app's tsc (its .d.ts imports
      # resolve against root). test-apps are covered by the `test` job.
      - run: pnpm test:lib
      - run: pnpm test:integration

  # The default toolchain is TypeScript 7. This job builds with 7, as npm
  # ships it, then swaps every workspace package to TypeScript 6: the library
  # still compiles on 6, and TypeScript 6 consumers (the test apps) type-check
  # against the .d.ts that 7 emitted. Lint stays on the default job: oxlint
  # type-checks with its own TypeScript 7 either way.
  typescript-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ts6

  # engines.node promises >=20, but vitest, pnpm and graphql 17 need Node 22+.
  # So install and build on the pinned Node, swap to the oldest peers
  # (Apollo Client 3, graphql 16), then load the built package on Node 20.
  node-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -w --save-dev "@apollo/client@^3.8.0" "graphql@^16.8.0"
      - run: pnpm build
      - run: mise exec node@20 -- node scripts/node20-smoke.cjs

  # On `schedule`, decide whether the nightly e2e run has anything new to
  # verify. Avoids burning CI minutes re-testing an idle repo against a
  # live third-party endpoint. Skipped on `workflow_dispatch` (manual runs
  # always proceed).
  check-changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_recent: ${{ steps.check.outputs.has_recent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          # Schedule fires daily. Only run e2e if HEAD has a commit newer
          # than the last schedule window (24h + 2h drift buffer).
          LATEST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE=$((NOW - LATEST))
          THRESHOLD=$((26 * 3600))
          if [ "$AGE" -lt "$THRESHOLD" ]; then
            echo "has_recent=true" >> "$GITHUB_OUTPUT"
            echo "Latest commit ${AGE}s old — running e2e"
          else
            echo "has_recent=false" >> "$GITHUB_OUTPUT"
            echo "Latest commit ${AGE}s old (> ${THRESHOLD}s) — skipping e2e"
          fi

  e2e:
    # Runs on manual dispatch always; on schedule only when check-changes
    # finds a recent commit. PR/push never run here (covered by unit tests
    # + matrix; e2e would block merges on live-endpoint flakes).
    needs: [check-changes]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && needs.check-changes.outputs.has_recent == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:run
        env:
          CI: "1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
